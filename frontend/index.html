<!DOCTYPE html>
<html>
<head>
    <title>Fake Product Detector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="title">Fake Product Identification System</h1>

<div class="main-container">

    <!-- LEFT SIDE -->
    <div class="left-panel">

        <h2>Product Details</h2>

        <input type="text" id="name" placeholder="Product Name">

        <input type="text" id="brand" placeholder="Brand Name">

        <input type="text" id="code" placeholder="Product Code">

        <input type="text" id="seller" placeholder="Seller Name">

        <button onclick="checkProduct()">Verify Product</button>

        <hr>

        <h3>Scan QR Code</h3>

        <button onclick="startScan()">Start Scan</button>

        <div id="reader"></div>

        <p id="scanResult"></p>

    </div>

    <!-- RIGHT SIDE -->
<div class="result-box">

    <h2>Verification Report</h2>

    <div id="result">
        <p>Your verification result will appear here.</p>
    </div>

</div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="script.js"></script>

</body>
</html>
